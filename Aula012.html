<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula(audio)</title>
</head>
<body>
    <h1> Reproduzindo Áudio</h1>
<p> Vamos aprender a reproduzir audios em HTML5</p>
<audio src="" controls autoplay></audio>
<!--MP3 WAV OGG-->
<audio preload="metadata" autoplay controls loop>
<source src="canzoni preferite - Yugo Kanno - Topic (128k).mp3" type="audio/mpeg">
<source src="canzoni preferite - Yugo Kanno - Topic (128k).mp3" type="audio/ogg">
<source src="canzoni preferite - Yugo Kanno - Topic (128k).mp3" type="audio/wav">
<p>infelizmente o seu navegador não consegue reproduzir áudio. <a
href="">Clique aqui para baixar o arquivo MP3</a>

</p>
</audio>
</body>
</html>
